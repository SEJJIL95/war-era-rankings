<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta
      name="description"
      content="War Era Player Rankings Tool - Search and compare players, view leaderboards, and track stats in real-time"
    />
    <meta name="keywords" content="War Era, Player Rankings, Leaderboard, Gaming Stats" />
    <meta name="author" content="War Era Community" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="War Era Player Rankings" />
    <meta property="og:description" content="Search for any player and compare rankings with players around them" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
    
    <!-- Google Fonts - Inter (Modern Font) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- Preconnect for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <title>War Era Player Rankings | Compare & Track Stats</title>
    
    <style>
      /* Global reset and base styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background-color: #0a0a0f;
        color: #f4f4f5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      
      ::-webkit-scrollbar-track {
        background: rgba(30, 30, 40, 0.5);
        border-radius: 10px;
      }
      
      ::-webkit-scrollbar-thumb {
        background: #a855f7;
        border-radius: 10px;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: #c084fc;
      }
      
      /* Selection color */
      ::selection {
        background: rgba(168, 85, 247, 0.3);
        color: #fff;
      }
      
      /* Animations */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      /* Utility classes */
      .animate-fade-in {
        animation: fadeIn 0.5s ease;
      }
      
      .animate-slide-up {
        animation: slideUp 0.4s ease;
      }
    </style>
  </head>
