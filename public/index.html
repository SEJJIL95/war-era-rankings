<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101714" />
    <meta name="description" content="Service discontinued. Some things matter more than a game." />
    <meta property="og:title" content="Service discontinued" />
    <meta property="og:description" content="Some things matter more than a game." />
    <meta property="og:type" content="website" />
    <title>Service discontinued</title>
    <style>
      :root { color-scheme: dark; font-family: Georgia, 'Times New Roman', serif; }
      * { box-sizing: border-box; }
      html { min-height: 100%; background: #101714; }
      body { margin: 0; min-height: 100svh; color: #f5f0e5; background: radial-gradient(ellipse 62% 52% at 50% 42%, #1b2821 0%, #101714 76%); }
      .page { min-height: 100svh; display: grid; grid-template-rows: 1fr auto; padding: clamp(24px, 4vw, 54px); }
      main { display: grid; place-items: center; padding: 48px 0 22px; }
      .statement { width: min(100%, 820px); text-align: center; }
      .mark { display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: clamp(36px, 7vh, 76px); }
      .mark::before, .mark::after { content: ''; width: 32px; height: 1px; background: #ae9471; opacity: .54; }
      .mark span { width: 7px; height: 7px; border: 1px solid #c5aa7e; transform: rotate(45deg); }
      h1 { font-size: clamp(3.3rem, 10vw, 7.75rem); line-height: .98; letter-spacing: -.065em; font-weight: 400; margin: 0 auto; max-width: 760px; text-wrap: balance; }
      .thought { font: 400 clamp(1rem, 2.2vw, 1.3rem)/1.55 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #c7c4b7; letter-spacing: -.025em; margin: clamp(26px, 4vw, 42px) 0 0; }
      .divider { height: 1px; width: 46px; background: #9f8968; opacity: .75; margin: clamp(40px, 7vh, 74px) auto clamp(30px, 5vh, 52px); }
      .arabic { font: 400 clamp(1.7rem, 4.6vw, 3rem)/1.8 'Traditional Arabic', 'Noto Naskh Arabic', 'Amiri', 'Times New Roman', serif; color: #e7ddc7; margin: 0; }
      .flag { font-size: clamp(1.7rem, 3vw, 2.25rem); line-height: 1; margin: clamp(25px, 4vh, 40px) 0 0; }
      footer { text-align: center; color: #969e92; font: 400 .7rem/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: .12em; text-transform: uppercase; padding: 16px 0 0; }
      @media (max-width: 600px) { .page { padding: 24px; } main { padding: 34px 0; } h1 { letter-spacing: -.055em; } .mark { margin-bottom: 44px; } footer { font-size: .62rem; } }
      @media (prefers-reduced-motion: no-preference) { .statement { animation: arrive .7s ease-out both; } @keyframes arrive { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } } }
    </style>
  </head>
  <body>
    <div class="page">
      <main>
        <div class="statement">
          <div class="mark" aria-hidden="true"><span></span></div>
          <h1>Service<br />discontinued.</h1>
          <p class="thought">Some things matter more than a game.</p>
          <div class="divider" aria-hidden="true"></div>
          <p class="arabic" lang="ar" dir="rtl">الحمد لله على نعمة الإسلام</p>
          <p class="flag" role="img" aria-label="Palestinian flag">🇵🇸</p>
        </div>
      </main>
      <footer>This project is no longer maintained.</footer>
    </div>
  </body>
</html>
